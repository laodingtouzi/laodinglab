<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>其他玩意儿 · Other Stuffs · 老丁实验室</title>
<meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;700&family=Inter:wght@300;400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #edeae6;
  --bg-surface: #f7f6f4;
  --bg-dark: #2d3a4f;
  --text: #2a3445;
  --text-secondary: #5c6b80;
  --text-muted: #9a9a9e;
  --text-on-dark: #e1dad8;
  --text-on-dark-muted: #a8a4a0;
  --border: #d0cbc5;
  --border-hover: #b8b2aa;
  --border-dark: rgba(225, 218, 216, 0.12);
  --accent: #B69C91;
  --accent-light: #e8ddd5;
  --accent-2: #76819C;
  --accent-4: #5c6b80;
  --shadow: rgba(42, 52, 69, 0.06);
  --shadow-hover: rgba(42, 52, 69, 0.12);
  --sans: 'Inter', 'Noto Sans SC', 'PingFang SC', sans-serif;
  --serif: 'Noto Serif SC', Georgia, serif;
  --mono: 'Roboto Mono', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  -webkit-font-smoothing: antialiased;
}

.site-header {
  background: var(--bg-dark);
  border-bottom: 1px solid var(--border-dark);
  padding: 14px 24px;
}
.header-inner {
  max-width: 900px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.logo-group { display: flex; align-items: center; gap: 8px; }
.logo-mark {
  width: 28px; height: 28px;
  border-radius: 6px;
  background: linear-gradient(135deg, var(--accent), #9a8a80);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700; color: #fff;
  flex-shrink: 0;
}
.site-name { font-size: 15px; font-weight: 600; color: var(--text-on-dark); line-height: 1.2; }
.site-name-en { font-family: var(--mono); font-size: 9px; color: var(--text-on-dark-muted); letter-spacing: .12em; text-transform: uppercase; }
.back-link {
  font-size: 13px; color: var(--text-on-dark-muted);
  text-decoration: none; transition: color .2s;
}
.back-link:hover { color: var(--text-on-dark); }

.hero {
  background: linear-gradient(135deg, #2a3445 0%, #364765 50%, #3d4f6b 100%);
  padding: 32px 24px 28px;
  text-align: center;
  border-bottom: 1px solid var(--border-dark);
}
.hero-inner { max-width: 600px; margin: 0 auto; }
.hero-eyebrow {
  font-family: var(--mono); font-size: 10px;
  letter-spacing: .2em; text-transform: uppercase;
  color: var(--text-on-dark-muted); margin-bottom: 8px;
}
.hero-title {
  font-size: 32px; font-weight: 700; line-height: 1.2;
  color: var(--text-on-dark); font-family: var(--serif);
  margin-bottom: 6px;
}
.hero-title span {
  font-family: var(--mono); font-weight: 400;
  letter-spacing: .1em; font-size: 0.5em;
  display: block; margin-top: 4px;
  color: var(--text-on-dark-muted);
}
.hero-desc {
  font-size: 13px; color: var(--text-on-dark-muted);
  line-height: 1.7; font-weight: 300; max-width: 440px;
  margin: 0 auto;
}

.main {
  flex: 1; max-width: 900px; margin: 0 auto;
  padding: 36px 24px 56px; width: 100%;
}
.section-label {
  font-family: var(--mono); font-size: 10px;
  letter-spacing: .2em; text-transform: uppercase;
  color: var(--text-muted); margin-bottom: 20px;
  display: flex; align-items: center; gap: 8px;
}
.section-label::before {
  content: ''; display: block;
  width: 12px; height: 2px;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
  border-radius: 1px;
}

.stuff-list { display: flex; flex-direction: column; gap: 16px; }
.stuff-card {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 24px;
  text-decoration: none;
  color: inherit;
  display: flex;
  align-items: flex-start;
  gap: 20px;
  transition: all .25s ease;
  position: relative;
  overflow: hidden;
  box-shadow: 0 1px 3px var(--shadow);
}
.stuff-card::before {
  content: ''; position: absolute;
  top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, var(--accent), var(--accent-2));
  opacity: 0; transition: opacity .25s;
}
.stuff-card:hover {
  border-color: var(--border-hover);
  transform: translateY(-2px);
  box-shadow: 0 8px 24px -4px var(--shadow-hover);
}
.stuff-card:hover::before { opacity: 1; }
.stuff-icon {
  width: 48px; height: 48px;
  border-radius: 10px;
  background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  font-size: 24px; flex-shrink: 0;
  border: 1px solid var(--border);
  transition: transform .2s;
}
.stuff-card:hover .stuff-icon { transform: scale(1.05); }
.stuff-body { flex: 1; }
.stuff-tag {
  font-family: var(--mono); font-size: 10px;
  letter-spacing: .12em; text-transform: uppercase;
  color: var(--text-muted); margin-bottom: 6px;
}
.stuff-title {
  font-size: 17px; font-weight: 600;
  line-height: 1.3; margin-bottom: 6px; color: var(--text);
}
.stuff-desc {
  font-size: 13px; color: var(--text-secondary);
  line-height: 1.7; font-weight: 300;
}
.stuff-cta {
  margin-top: 10px;
  font-size: 12px; font-weight: 500;
  color: var(--accent-4); letter-spacing: .04em;
  display: flex; align-items: center; gap: 6px;
}
.stuff-cta::after { content: '\2192'; transition: transform .2s; }
.stuff-card:hover .stuff-cta::after { transform: translateX(4px); }

.empty-hint {
  margin-top: 32px; padding: 20px;
  border: 1px dashed var(--border);
  border-radius: 10px; text-align: center;
  font-size: 12px; color: var(--text-muted);
  font-style: italic;
}

.site-footer {
  padding: 16px 24px;
  border-top: 1px solid var(--border-dark);
  background: var(--bg-dark);
}
.footer-inner {
  max-width: 900px; margin: 0 auto;
  display: flex; justify-content: space-between;
  align-items: center; flex-wrap: wrap; gap: 8px;
}
.footer-brand { font-size: 13px; font-weight: 600; color: var(--text-on-dark-muted); }
.footer-note { font-family: var(--mono); font-size: 10px; color: var(--text-on-dark-muted); letter-spacing: .08em; text-transform: uppercase; }

@media (max-width: 768px) {
  .stuff-card { flex-direction: column; gap: 12px; }
}
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div class="logo-group">
      <div class="logo-mark">L</div>
      <div>
        <div class="site-name">老丁实验室</div>
        <div class="site-name-en">Laodinglab</div>
      </div>
    </div>
    <a href="/" class="back-link">← 返回主页</a>
  </div>
</header>

<section class="hero">
  <div class="hero-inner">
    <div class="hero-eyebrow">Side Projects</div>
    <h1 class="hero-title">
      其他玩意儿
      <span>OTHER STUFFS</span>
    </h1>
    <p class="hero-desc">非主流小玩意儿集散地——一些不那么严肃的小工具、小游戏和实验性项目。</p>
  </div>
</section>

<main class="main">
  <div class="section-label">项目列表 · Projects</div>

  <div class="stuff-list">

    <a href="/otherstuffs/kismetgame/" class="stuff-card">
      <div class="stuff-icon">🃏</div>
      <div class="stuff-body">
        <div class="stuff-tag">Card Divination Game</div>
        <div class="stuff-title">命运扑克 Kismet</div>
        <p class="stuff-desc">源自 1990 年代 VB6 经典扑克牌算命游戏，移植至现代浏览器。四阶段玩法：搭塔配对、寻找对牌、选择释命、翻牌解读——让命运来回答你的问题。</p>
        <div class="stuff-cta">开始算命</div>
      </div>
    </a>

  </div>

  <div class="empty-hint">更多玩意儿随缘更新…</div>
</main>

<footer class="site-footer">
  <div class="footer-inner">
    <span class="footer-brand">老丁实验室 · Laodinglab</span>
    <span class="footer-note">laodinglab.com</span>
  </div>
</footer>

</body>
</html>
